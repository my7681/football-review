<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="3SrqRh9W6l0w86FXi52El7">

<meta charset="UTF-8" data-page-node-id="0ZFLPZ1Se8g3PXM9W5n1q4">

<title>黄湖少儿足球2班 · 课后反馈</title>
<style>
  :root{
    /* 主色：蓝（参考色卡1）· 次色：青（参考色卡3）· 强调：青柠（参考色卡2） */
    --blue-1:#A4C7FD; --blue-2:#C6E8FC;
    --lime-1:#CFFA7C; --lime-2:#9BE89E;
    --mint-1:#84F6B5; --mint-2:#8ED6EE;
    --green:#2F6FE4; --green-2:#17A2B8; --gold:#CDF97A;
    --bg:#F0F2F5; --card:#FFFFFF; --text:#122A44; --muted:#5B7089;
    --line:#E3E9F2; --green-soft:#EDF4FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding:24px 16px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}

  /* 顶部课程信息条 */
  .head{
    background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);
    color:#fff;border-radius:16px;padding:22px 26px;position:relative;overflow:hidden;
    box-shadow:0 6px 20px rgba(27,94,32,.18);
    display:flex;align-items:center;gap:20px;
  }
  .head::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;
    background:var(--gold);opacity:.16;border-radius:50%}
  .head .brand{position:relative;z-index:1;flex:0 0 auto;padding:4px 2px}
  .head .brand img{display:block;height:44px;width:auto;max-width:230px}
  .head .head-main{position:relative;z-index:1;flex:1 1 auto;min-width:0}
  .head h1{font-size:24px;letter-spacing:1px;display:flex;align-items:center;gap:10px}
  .head .badge{background:var(--gold);color:var(--green);font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:20px}
  .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    padding:6px 12px;border-radius:10px;font-size:13px}
  .chip b{font-weight:700}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
    text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .kpi .num{font-size:30px;font-weight:800;color:var(--green)}
  .kpi .num small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
  .kpi .lab{font-size:13px;color:var(--muted);margin-top:4px}

  /* WHAT+HOW 副标题 */
  .what{background:var(--green-soft);border-left:5px solid var(--gold);border-radius:10px;
    padding:12px 16px;font-size:14px;color:var(--green);font-weight:600;margin-bottom:18px}
  .what span{color:var(--muted);font-weight:400;display:block;font-size:13px;margin-top:2px}

  /* 工具条 */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
  .toolbar label{font-size:14px;font-weight:600}
  select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--text);cursor:pointer;min-width:160px}
  .btn{font:inherit;font-weight:600;padding:8px 16px;border:none;border-radius:10px;
    cursor:pointer;transition:.15s}
  .btn.print{background:var(--green);color:#fff}
  .btn.copy{background:var(--gold);color:var(--green)}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .count{margin-left:auto;font-size:13px;color:var(--muted)}

  /* 表格 */
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
    border:1px solid var(--line);border-radius:14px;overflow:hidden}
  thead th{background:var(--green);color:#fff;font-size:13px;font-weight:600;
    padding:12px 10px;text-align:left;white-space:nowrap}
  tbody td{padding:11px 10px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
  tbody tr.row{cursor:pointer;transition:background .12s}
  tbody tr.row:hover{background:var(--green-soft)}
  tbody tr.row.open{background:var(--green-soft)}
  .tw{color:var(--green);font-weight:700;font-size:12px}
  .cap{display:inline-block;background:var(--gold);color:var(--green);font-size:12px;
    font-weight:700;padding:2px 9px;border-radius:20px}
  .theme{font-weight:600;color:var(--green-2)}
  .ssg{font-weight:700;color:var(--green)}
  .toggle{color:var(--muted);font-size:18px;text-align:center;width:28px}
  .tghint{display:none}

  /* 展开明细 */
  tr.detail td{background:#FBFDFB;padding:0 10px 14px 10px}
  tr.detail .box{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .blk-video{grid-column:1 / -1}
  .videos{display:flex;flex-wrap:wrap;gap:10px}
  .vcard{width:118px;cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;position:relative;flex:0 0 auto;text-decoration:none;display:block;-webkit-tap-highlight-color:transparent;user-select:none}
  .vthumb{width:100%;height:198px;object-fit:cover;display:block;background:#0d0d0d}
  .vname{display:block;font-size:10px;line-height:1.4;color:#fff;padding:5px 6px;background:rgba(0,0,0,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px;box-sizing:border-box}
  .vhint{font-size:11px;font-weight:400;color:var(--muted);margin-left:6px}
  /* 微信环境提示条（JS 检测 MicroMessenger 后显示） */
  .wxtip{display:none;background:#FFFBEB;border:1px solid #F0C24B;border-left:5px solid #E6A700;
    border-radius:12px;padding:12px 16px;margin:14px 0 0;font-size:13.5px;color:#7a5c00;
    line-height:1.7;font-weight:600}
  .wxtip b{color:#B37400}
.vplay{position:absolute;left:50%;top:99px;transform:translate(-50%,-50%);width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.85);color:#fff;font-size:13px;pointer-events:none}
  
  
  
  
  @media(max-width:720px){ .vcard{flex:0 0 calc(33.333% - 7px)} .vthumb{height:150px} .vplay{top:75px} }
  tr.detail .blk{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
  tr.detail .blk h4{font-size:13px;color:var(--green);margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  tr.detail .blk h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gold)}
  tr.detail .blk p{font-size:13.5px;color:var(--text);white-space:pre-wrap}
  .note-tag{display:inline-block;background:#EAF7DC;color:#3F6B2A;font-size:12px;
    padding:2px 9px;border-radius:8px;margin-top:4px}

  .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}

  /* 12周训练主题计划表：绿头 + 金边 + 金色课次列 + 绿底斑马纹 */
  .plan-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .plan-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
    border:2px solid var(--gold);border-radius:14px;overflow:hidden;font-size:14px}
  .plan-table thead th{background:var(--green);color:#fff;font-size:13px;font-weight:700;
    padding:12px 12px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--gold)}
  .plan-table tbody td{padding:12px 12px;border-top:1px solid var(--line);vertical-align:top;
    font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
  .plan-table tbody tr:nth-child(even){background:var(--green-soft)}
  .plan-table tbody tr:hover{background:#F3FFE6}
  .plan-table .wk{background:var(--gold);color:var(--green);font-weight:800;text-align:center;
    white-space:nowrap;width:70px;font-size:14px;border-top:1px solid var(--gold)}
  .plan-table tbody tr:nth-child(even) .wk{background:var(--gold)}
  .plan-table .th-theme{font-weight:700;color:var(--green-2);min-width:150px}

  /* 打印 */
  @media print{
    body{background:#fff;padding:0}
    .head{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .nav{display:none!important}
    .toolbar,.toggle{display:none!important}
    .kpi,.head,table{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tr.detail{display:table-row!important}
    tbody tr.detail td{background:#fff}
    .wrap{max-width:none}
  }
  /* 单课分享卡片打印：只出海报 */
  @media print{
    body.print-share{background:#fff;padding:0}
    body.print-share .wrap,body.print-share .nav,body.print-share .toast,
    body.print-share .modal-mask,body.print-share .modal-bar{display:none!important}
    body.print-share .modal{position:static;display:block!important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    body.print-share .card-poster{width:360px;aspect-ratio:auto;height:auto;max-height:none;
      box-shadow:none;margin:0 auto}
    body.print-share .card-poster .ph{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media(max-width:720px){
    body{padding:16px 12px 48px}
    .head{flex-direction:column;align-items:flex-start;gap:12px;padding:16px 18px}
    .head h1{font-size:19px}
    .head .brand img{height:34px;max-width:170px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpi{padding:14px}
    .kpi .num{font-size:26px}
    tr.detail .box{grid-template-columns:1fr}
    tr.detail .box{grid-template-columns:1fr;gap:10px}
    /* 反馈表手机端：每行变独立卡片，列换行堆叠（取消横向滚动） */
    .table-scroll{overflow:visible}
    table, thead, tbody, tr, td{display:block;width:100%}
    thead{display:none}
    table{min-width:0;border:none;background:transparent;box-shadow:none;
      border-radius:0;overflow:visible}
    tbody tr.row{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;
      background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow:hidden;cursor:pointer}
    tbody tr.row td{border-top:1px solid var(--line);padding:10px 12px;font-size:14px;
      display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
    tbody tr.row td:first-child{border-top:none}
    tbody tr.row td::before{content:attr(data-label);font-weight:700;color:var(--muted);
      font-size:12.5px;text-align:left;flex:0 0 auto;margin-right:8px}
    tbody tr.row td.toggle{display:flex;justify-content:center;gap:6px;width:auto;
      background:var(--green-soft);color:var(--green);font-size:13px;cursor:pointer}
    .tghint{display:inline;font-size:12.5px;font-weight:600}
    tr.detail{display:block;margin:-13px 0 12px;border:1px solid var(--line);
      border-top:none;border-radius:0 0 12px 12px;background:#fff;overflow:hidden}
    tr.detail td{display:block;padding:0 12px 14px;background:#fff;border-top:none}
    .nav button{padding:10px 14px;font-size:13px}
    /* 计划表手机端保持表格+横向滚动，不参与反馈表的卡片堆叠 */
    .plan-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .plan-table{display:table;width:100%;min-width:780px;border:2px solid var(--gold);border-radius:14px}
    .plan-table thead{display:table-header-group}
    .plan-table tbody{display:table-row-group}
    .plan-table tr{display:table-row}
    .plan-table th,.plan-table td{display:table-cell;text-align:left;width:auto;white-space:normal}
    .plan-table .wk{width:70px}
  }
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;
    opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}

  /* 顶部导航标签 */
  .nav{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
  .nav button{font:inherit;font-weight:600;padding:11px 20px;border:1px solid var(--line);
    background:#fff;color:var(--muted);border-radius:12px 12px 0 0;cursor:pointer;transition:.15s;
    border-bottom:none}
  .nav button.active{background:var(--green);color:#fff;border-color:var(--green);
    box-shadow:0 -2px 0 var(--gold) inset}
  .nav button:hover{filter:brightness(1.03)}
  .page{display:block}

  /* 信息页（教练介绍 / 训练目标）键值卡 */
  .info-h{font-size:16px;font-weight:700;color:var(--green);margin:14px 0 8px}
  .kv{display:grid;grid-template-columns:1fr;gap:14px}
  .kv .item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);
    border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .kv .item h3{font-size:15px;color:var(--green);margin-bottom:6px;
    display:flex;align-items:center;gap:8px}
  .kv .item h3::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--gold)}
  .kv .item p{font-size:14px;color:var(--text);white-space:pre-wrap;line-height:1.75}
  .kv .item .sub{font-size:12.5px;color:var(--muted);margin-top:6px}

  /* 重点条目（四不军规 / 本期基本功）高亮图标卡 */
  .kv .item.feature{background:linear-gradient(135deg,#F3FFE6 0%,#FFFBF0 100%);
    border-left:6px solid var(--gold);box-shadow:0 4px 14px rgba(147,216,120,.35)}
  .kv .item.feature h3{font-size:17px}
  .kv .item .must{display:inline-block;background:var(--green);color:#fff;font-size:11px;
    font-weight:700;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .kv .item .badge-ico{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--green);
    font-size:14px;font-weight:800;margin-right:8px;vertical-align:middle}

  /* 页脚：教练微信二维码 */
  .foot{margin:26px 0 8px;padding:18px 16px 16px;background:var(--card);
    border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;
    text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .foot img{display:block;width:190px;height:190px;margin:0 auto 10px;background:#fff;
    border-radius:10px;padding:5px;border:1px solid var(--line)}
  .foot p{font-size:14px;font-weight:700;color:var(--green);letter-spacing:.5px}
  @media (max-width:480px){
    body{font-size:15px;padding:14px 10px 44px;line-height:1.65}
    .head h1{font-size:18px}
    .head .brand img{height:30px;max-width:150px}
    .kpis{gap:8px}
    .kpi .num{font-size:24px}
    .kpi .lab{font-size:12px}
    .foot img{width:150px;height:150px}
    .card-poster{width:94vw}
    .card-poster .ph .th{font-size:18px}
    .card-poster .pwx img{width:120px;height:120px}
    .nav button{padding:9px 11px;font-size:12.5px}
    .toolbar{gap:8px}
    .toolbar label{font-size:13px}
    select{min-width:120px;font-size:14px}
    .what{font-size:13.5px}
  }
  @media (max-width:360px){
    .foot img{width:136px;height:136px}
    .card-poster .pwx img{width:108px;height:108px}
  }

  /* 分享卡片弹层 */
  .modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center}
  .modal.show{display:flex}
  .modal-mask{position:absolute;inset:0;background:rgba(15,30,20,.55)}
  .modal-bar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;z-index:2}
  .card-poster{position:relative;z-index:1;width:min(360px,92vw);aspect-ratio:9/16;
    max-height:92vh;overflow-y:auto;background:#fff;border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);padding:0 0 18px}
  .card-poster .ph{background:linear-gradient(135deg,var(--green),var(--green-2));
    color:#fff;padding:18px 20px;border-radius:18px 18px 0 0}
  .card-poster .ph .cn{font-size:15px;opacity:.92}
  .card-poster .ph .dt{font-size:13px;opacity:.85;margin-top:2px}
  .card-poster .ph .th{font-size:20px;font-weight:800;margin-top:8px;line-height:1.35}
  .card-poster .row2{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
  .card-poster .mini{background:var(--green-soft);border-radius:10px;padding:8px 12px;font-size:13px}
  .card-poster .mini b{color:var(--green)}
  .card-poster .sec{padding:12px 20px 0}
  .card-poster .sec h4{font-size:13px;color:var(--green);margin-bottom:4px;
    display:flex;align-items:center;gap:6px}
  .card-poster .sec h4::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--gold)}
  .card-poster .sec p{font-size:13.5px;color:var(--text);white-space:pre-wrap;line-height:1.7}
  .card-poster .home{margin:12px 20px 0;background:#F3FFE6;border:1px solid var(--gold);
    border-radius:12px;padding:12px 14px}
  .card-poster .home h4{font-size:13px;color:#3F6B2A;margin-bottom:4px}
  .card-poster .home p{font-size:13.5px;white-space:pre-wrap;line-height:1.7}
  /* 二维码放大遮罩 */
  .qr-box{position:relative;z-index:1;background:#fff;border-radius:18px;padding:22px 22px 18px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center;max-width:86vw}
  .qr-box img{display:block;width:min(240px,72vw);height:auto;aspect-ratio:1/1;margin:0 auto;background:#fff;border-radius:10px;padding:6px}
  .qr-box p{margin-top:14px;font-size:15px;font-weight:700;color:var(--green);letter-spacing:.3px}
  .card-poster .sign{text-align:right;font-size:12.5px;color:var(--muted);padding:12px 20px 0}
  .card-poster .wx{text-align:center;font-size:13px;font-weight:700;color:var(--green);
    background:var(--green-soft);border-radius:10px;padding:8px 14px;margin:10px 20px 0}
  /* 海报底部二维码（之前漏了尺寸，会按 720px 原图撑破海报） */
  .card-poster .pwx{text-align:center;margin:12px 20px 0}
  .card-poster .pwx img{display:block;width:130px;height:130px;margin:0 auto;background:#fff;
    border-radius:10px;padding:6px;border:1px solid var(--line)}
  .card-poster .pwx p{font-size:13px;font-weight:700;color:var(--green);margin-top:6px}
  /* 视频播放弹层（手机上 target=_blank 会被吃成下载二进制，改为内嵌 video） */
  .video-box{position:relative;z-index:1;background:#0d0d0d;border-radius:14px;
    padding:14px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;align-items:center}
  .video-box video{display:block;width:100%;max-width:480px;max-height:72vh;
    background:#000;border-radius:10px}
  .video-box .vfilename{color:#fff;font-size:13px;margin-top:10px;text-align:center;
    letter-spacing:.5px;word-break:break-all;max-width:90vw}
  .video-box .vclose{margin-top:12px;font:inherit;font-weight:600;padding:8px 22px;
    border:none;border-radius:10px;cursor:pointer;background:#D9E6F5;color:#122A44}
  .video-box .vclose:hover{filter:brightness(1.05)}

  /* ===== 2班主题：参考色卡（蓝 #A4C7FD / 青柠 #CFFA7C / 薄荷 #84F6B5）===== */
  .kpi{border-color:transparent;border-radius:16px}
  .kpi:nth-child(1){background:linear-gradient(135deg,#A4C7FD 0%,#C6E8FC 100%)}
  .kpi:nth-child(2){background:linear-gradient(135deg,#CFFA7C 0%,#9BE89E 100%)}
  .kpi:nth-child(3){background:linear-gradient(135deg,#84F6B5 0%,#8ED6EE 100%)}
  .kpi:nth-child(4){background:linear-gradient(135deg,#B6DBFC 0%,#8AD8E8 100%)}
  .kpi .num{color:#0F3B7A}
  .kpi .num small{color:#2B4E75}
  .kpi .lab{color:#2B4E75;font-weight:600}
  .head{background:linear-gradient(135deg,#2F6FE4 0%,#17A2B8 100%)}
  .nav button.active{background:linear-gradient(135deg,var(--green),var(--green-2));

/* ---------- KPI 卡片 ---------- */
function renderKPI(){
  const total = DATA.length;
  const avg = total ? Math.round(DATA.reduce((s,d)=>s+(+d.trainees||0),0)/total) : 0;
  const ssg = DATA.reduce((s,d)=>s+(+d.ssg||0),0);
  const last = DATA.length ? DATA.reduce((a,b)=> a.date > b.date ? a : b).date : "—";
  const cards = [
    {num:total, unit:"次", lab:"总课次"},
    {num:avg,   unit:"位", lab:"平均训练人数"},
    {num:ssg,   unit:"分", lab:"累计对抗/SSG时间"},
    {num:last,  unit:"",   lab:"最近一课"}
  ];
  document.getElementById("kpis").innerHTML = cards.map(c=>
    `<div class="kpi"><div class="num">${c.num}<small>${c.unit}</small></div>`+
    `<div class="lab">${c.lab}</div></div>`).join("");
}

/* ---------- 日期下拉 ---------- */
function renderSelect(){
  const sel = document.getElementById("sel");
  const dates = [...new Set(DATA.map(d=>d.date))].sort();
  sel.innerHTML = `<option value="__all__">全部（${dates.length}次课）</option>` +
    dates.map(d=>{const r=DATA.find(x=>x.date===d);
      return `<option value="${d}">${d} ${r.weekday}</option>`}).join("");
  sel.onchange = ()=>renderTable(sel.value);
}

/* ---------- 教练介绍 / 训练目标 渲染 ---------- */
function renderKV(elId, list){
  const el = document.getElementById(elId);
  if(!list || !list.length){ el.innerHTML = `<div class="empty">暂无数据</div>`; return; }
  const featWords = ["四不军规","本期","基本功","训练结果目标"];
  el.innerHTML = list.map(x=>{
    const hit = featWords.find(w=>x.item.indexOf(w)>=0);
    const isFeat = !!hit;
    const cls = isFeat ? "item feature" : "item";
    const icoTxt = hit==="四不军规" ? "规" : (hit==="训练结果目标" ? "标" : "功");
    const ico = isFeat ? `<span class="badge-ico">${icoTxt}</span>` : "";
    const must = isFeat ? `<span class="must">家长必看</span>` : "";
    const sub = x.sub ? `<div class="sub">${esc(x.sub)}</div>` : "";
    return `<div class="${cls}"><h3>${ico}${esc(x.item)}${must}</h3>`+
      `<p>${esc(x.content||"—")}</p>${sub}</div>`;
  }).join("");
}
function renderCoach(){ renderKV("coachList", COACH); }
function renderGoal(){ renderKV("goalList", GOAL); }
function renderPlan(){
  const el = document.getElementById("planList");
  if(!PLAN || !PLAN.length){ el.innerHTML = `<div class="empty">暂无数据</div>`; return; }
  const head = ["课次","训练主题","本周目标","重点成果","家训配合建议","备注"];
  const body = PLAN.map(x=>{
    const cell = (v)=>`<td>${v?esc(v):"—"}</td>`;
    return `<tr><td class="wk">第 ${x.week} 周</td>`+
      `<td class="th-theme">${esc(x.theme||"")}</td>`+
      cell(x.goal)+cell(x.result)+cell(x.home)+cell(x.note)+`</tr>`;
  }).join("");
  el.innerHTML = `<div class="plan-scroll"><table class="plan-table">`+
    `<thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`+
    `<tbody>${body}</tbody></table></div>`;
}

/* ---------- 标签切换 ---------- */
function showPage(id){
  const pages = {review:"page-review", coach:"page-coach", goal:"page-goal", plan:"page-plan"};
  Object.keys(pages).forEach(k=>{
    document.getElementById(pages[k]).style.display = (k===id) ? "block" : "none";
    document.getElementById("tab-"+k).classList.toggle("active", k===id);
  });
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- 静态资源版本 ----------
   CDN（CloudStudio Gateway / EdgeOne）按「完整 URL」缓存，改文件内容但 URL 不变时
   线上仍会命中旧缓存（实测视频压缩后线上依旧返回旧 36MB 文件）。
   改动这里即可让手机立刻取到新版视频与封面。
   file:// 本地双击不能带参数（会找不到文件），故按协议分支。 */
var ASSET_V = (location.protocol === "file:") ? "" : "?v=20260921b";
function assetURL(u){ return ASSET_V ? (u + ASSET_V) : u; }

/* ---------- 反馈表 ---------- */
function renderTable(filter){
  currentFilter = filter;
  const tbody = document.getElementById("tbody");
  const rows = filter==="__all__" ? DATA : DATA.filter(d=>d.date===filter);
  document.getElementById("count").textContent = `共 ${rows.length} 条记录`;
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="8" class="empty">暂无记录</td></tr>`; return; }
  tbody.innerHTML = rows.map((d,i)=>{
    const note = (d.note && d.note!=="无" && d.note!=="无。")
      ? `<div class="note-tag">${esc(d.note)}</div>` : `<span style="color:var(--muted)">无</span>`;
    return `
    <tr class="row" onclick="toggle(${i})">
      <td data-label="日期"><span class="tw">${esc(d.date)}</span></td>
      <td data-label="星期">${esc(d.weekday||"")}</td>
      <td data-label="人数">${esc(d.trainees)}</td>
      <td data-label="今日队长"><span class="cap">${esc(d.captain||"")}</span></td>
      <td class="theme" data-label="训练主题">${esc(d.theme||"")}</td>
      <td class="ssg" data-label="对抗(min)">${esc(d.ssg)}</td>
      <td data-label="异动/备注">${note}</td>
      <td class="toggle" id="tg${i}"><span class="tg">▾</span><span class="tghint">点击展开训练明细</span></td>
    </tr>
    <tr class="detail" id="dt${i}" style="display:none">
      <td colspan="8">
        <div class="box">
          <div class="blk"><h4>动作细节（技术要点）</h4>
            <p>${esc(d.technique||"—")}</p></div>
          <div class="blk"><h4>过程 Review（练得如何）</h4>
            <p>${esc(d.process||"—")}</p></div>
          <div class="blk"><h4>本周目标与重点成果</h4>
            <p>${esc(d.weeklyGoal||"—")}</p></div>
          <div class="blk"><h4>家训配合建议</h4>
            <p>${esc(d.homeTip||"—")}</p></div>
          <div class="blk blk-video"><h4>训练视频 <span class="vhint">点按卡片在页面内播放</span></h4>
            <div class="videos">${ (d.videos && d.videos.length) ? d.videos.map((v,i)=>`<div class="vcard" data-fn="${esc(v)}" onclick="playVideo(this.dataset.fn)"><img class="vthumb" src="${THUMB_MAP[v]||assetURL("video/thumb/t"+(i+1)+".jpg")}" alt=""><span class="vplay">▶</span><span class="vname">${esc(v)}</span></div>`).join("") : `<span style="color:var(--muted)">暂无视频</span>` }</div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join("");
}

function toggle(i){
  const dt = document.getElementById("dt"+i);
  const tg = document.getElementById("tg"+i);
  const open = dt.style.display==="none";
  dt.style.display = open ? "" : "none";   // 空字符串回退 CSS：桌面 table-row，手机 block
  const arrow = tg.querySelector(".tg");
  if(arrow) arrow.textContent = open ? "▴" : "▾";
  const hint = tg.querySelector(".tghint");
  if(hint) hint.textContent = open ? "点击收起" : "点击展开训练明细";
  dt.closest("tr").previousElementSibling.classList.toggle("open", open);
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);}

/* ---------- 单课分享卡片（发微信群） ---------- */
function pickLesson(){
  if(currentFilter!=="__all__"){
    const r = DATA.find(d=>d.date===currentFilter);
    if(r) return r;
  }
  // 默认取最近一次课
  return DATA.length ? DATA.reduce((a,b)=> a.date > b.date ? a : b) : null;
}
function posterHTML(d){
  if(!d) return `<div class="ph"><div class="cn">暂无记录</div></div>`;
  const mini = [
    `人数 <b>${esc(d.trainees||"—")}</b>`,
    `队长 <b>${esc(d.captain||"—")}</b>`,
    `对抗 <b>${esc(d.ssg||"—")}分</b>`
  ].join("");
  return `
  <div class="ph">
    <div class="cn">${esc(META.name)}</div>
    <div class="dt">${esc(d.date)} ${esc(d.weekday||"")}　教练：${esc(META.coach)}</div>
    <div class="th">${esc(d.theme||"—")}</div>
  </div>
  <div class="row2"><div class="mini">${mini}</div></div>
  <div class="sec"><h4>技术要点</h4><p>${esc(d.technique||"—")}</p></div>
  <div class="sec"><h4>过程 Review</h4><p>${esc(d.process||"—")}</p></div>
  <div class="sec"><h4>本周目标与重点成果</h4><p>${esc(d.weeklyGoal||"—")}</p></div>
  <div class="home"><h4>家训配合建议</h4><p>${esc(d.homeTip||"—")}</p></div>
  <div class="sign">${esc(META.coach)} 敬上</div>
  ${META.wechat?`<div class="wx">教练微信：${esc(META.wechat)}（扫码或搜索添加）</div>`:""}
  <div class="pwx">
    <img class="pqr" src="${QR_SRC}" alt="教练微信二维码" onclick="openQrZoom()" onerror="this.onerror=null;this.src=QR_FALLBACK">
    <p>咨询请加教练微信</p>
  </div>`;
}
function openShare(){
  const d = pickLesson();
  if(!d){ toast("暂无可分享的课次"); return; }
  document.getElementById("poster").innerHTML = posterHTML(d);
  document.getElementById("shareModal").classList.add("show");
}
function closeShare(){ document.getElementById("shareModal").classList.remove("show"); }
function printShare(){
  document.body.classList.add("print-share");
  window.print();
  // 打印（或取消）后恢复
  const done=()=>{document.body.classList.remove("print-share");
    window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  setTimeout(()=>document.body.classList.remove("print-share"),1500);
}
function copyPoster(){
  const d = pickLesson();
  if(!d){ toast("暂无可分享的课次"); return; }
  const out = `${META.name} · 课后反馈\n${d.date} ${d.weekday}　教练：${META.coach}\n`+
    `训练主题：${d.theme}\n人数：${d.trainees}　队长：${d.captain}　对抗：${d.ssg}分\n`+
    `技术要点：\n${d.technique}\n过程Review：\n${d.process}\n`+
    `本周目标：\n${d.weeklyGoal}\n家训配合建议：\n${d.homeTip}`;
  navigator.clipboard.writeText(out).then(
    ()=>toast("已复制，可直接粘贴到微信群"),
    ()=>toast("复制失败，请手动选择")
  );
}

/* ---------- 视频弹层播放 ---------- */
/* 视频卡片用 <div> 而不是 <a>：手机上 <a href>（无论 javascript:void(0) 还是
   video/xxx.mp4?query）会被部分 WebView 解析成 about:blank，弹「需要使用新应用
   以打开此 about 链接」。纯 div + onclick 让浏览器根本没有 URL 可打开。 */
function playVideo(fn){
  const v = document.getElementById('vPlayer');
  v.src = assetURL('video/'+fn);
  v.load();
  document.getElementById('vName').textContent = fn;
  const tip = document.getElementById('wxVideoTip');
  if (tip) tip.style.display = IS_WX ? 'block' : 'none';
  document.getElementById('videoModal').classList.add('show');
  // 非微信环境：onclick 视作用户手势，移动端一般能直接 play；个别浏览器可能需用户手点 ▶
  // 微信环境：视频本体被平台 403 拦截，不主动 play（避免黑屏报错），靠弹层提示引导去浏览器
  if (!IS_WX) { try { const p = v.play(); if (p && p.catch) p.catch(()=>{}); } catch(e) {} }
}
function closeVideo(){
  const v = document.getElementById('vPlayer');
  try { v.pause(); } catch(e) {}
  v.removeAttribute('src');
  v.load();
  document.getElementById('videoModal').classList.remove('show');
}

/* ---------- 微信环境提示 ---------- */
/* 平台对微信 UA 的全路径都返回 403（实测 HTML/封面图/视频一律被拦），
   微信里页面骨架可能来自本地缓存，但图片与视频必然加载失败 →
   直接提示用户改用浏览器打开，不要让他们以为是页面坏了。 */
if (IS_WX) {
  const wxTip = document.getElementById('wxTip');
  if (wxTip) wxTip.style.display = 'block';
}

renderKPI();
renderSelect();
renderTable("__all__");
renderCoach();
renderGoal();

window.showPage   = showPage;
window.toggle     = toggle;
window.openQrZoom = openQrZoom;
window.closeQr    = closeQr;
window.openShare  = openShare;
window.closeShare = closeShare;
window.printShare = printShare;
window.copyPoster = copyPoster;
window.playVideo   = playVideo;
window.closeVideo  = closeVideo;
})();
</script>
